<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>himiyosh - Portfolio</title>
  <!-- CSSを読み込み -->
  <link rel="stylesheet" href="styles.css" />
  <!-- particles.js で幾何学模様を描画 -->
  <script src="https://cdn.jsdelivr.net/npm/particles.js"></script>
  <!-- i18next for multi-language support -->
  <script src="https://unpkg.com/i18next@21.6.16/dist/umd/i18next.min.js"></script>
  <!-- Google AdSense -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3044810068333301"
     crossorigin="anonymous"></script>
</head>
<body>
  <!-- 固定ヘッダー -->
  <header id="header" class="header">
    <div class="logo">himiyosh</div>
    <button
      id="hamburger-menu"
      class="hamburger-menu"
      type="button"
      aria-controls="nav-menu"
      aria-expanded="false"
      aria-label="ナビゲーションを開く"
    >
      <span class="hamburger-icon" aria-hidden="true">&#9776;</span>
    </button>
    <nav id="nav-menu" class="nav-menu">
      <a href="#about" data-i18n="nav.about">About</a>
      <a href="#projects" data-i18n="nav.projects">Projects</a>
      <a href="#contact" data-i18n="nav.contact">Contact</a>
      <button id="lang-toggle">EN</button>
    </nav>
  </header>
  <!-- 幾何学模様を表示する領域：背景の最背面に配置 -->
  <div id="particles-js" aria-hidden="true"></div>
  <!-- ヒーローセクション（画像＋グラデーション背景） -->
  <section class="hero">
    <h1>himiyosh</h1>
    <p class="typing-text">Engineer / Rookie Dad</p>
  </section>
  <!-- About セクション -->
  <section id="about">
    <h2 data-i18n="about.title">About</h2>
    <p data-i18n="about.content">
      某グローバルIT企業にてテクノロジー領域の課題解決に携わるエンジニア。人の役に立つ知識・技術の探求が大好き。
    </p>
  </section>
  <!-- Projects セクション -->
  <section id="projects">
    <h2 data-i18n="projects.title">Projects</h2>
    <div class="projects-container" id="projects-container"></div>
  </section>
  <!-- Contact セクション -->
  <section id="contact">
    <h2 data-i18n="contact.title">Contact</h2>
    <p>Email: <a href="mailto:himiyosh@gmail.com">himiyosh@gmail.com</a></p>
    <p>GitHub: <a href="https://github.com/himiyosh" target="_blank" rel="noopener noreferrer">himiyosh</a></p>
  </section>
  <!-- フッター：コピーライト＋ディスクレーマー（控えめに） -->
  <footer>
    <p>&copy; 2025 himiyosh</p>
    <p data-i18n="disclaimer" class="footer-disclaimer"></p>
  </footer>
  <!-- メインロジック読み込み -->
  <script src="script.js"></script>
  <script src="i18n.js"></script>
</body>
</html>
