<!DOCTYPE html>
<html lang="{{language}}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="{{description}}" />
  <meta name="robots" content="noindex,follow" />
  <meta name="theme-color" content="#0c1014" />
  <meta name="color-scheme" content="dark" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="himiyosh" />
  <meta property="og:title" content="{{pageTitle}}" />
  <meta property="og:description" content="{{description}}" />
  <meta property="og:url" content="{{canonicalUrl}}" />
  <meta property="og:locale" content="{{locale}}" />
  <meta property="og:locale:alternate" content="{{alternateLocale}}" />
  <meta property="og:image" content="{{imageUrl}}" />
  <meta property="og:image:type" content="image/jpeg" />
  <meta property="og:image:width" content="960" />
  <meta property="og:image:height" content="540" />
  <meta property="og:image:alt" content="{{imageAlt}}" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="{{pageTitle}}" />
  <meta name="twitter:description" content="{{description}}" />
  <meta name="twitter:image" content="{{imageUrl}}" />
  <meta name="twitter:image:alt" content="{{imageAlt}}" />
  <link rel="canonical" href="{{canonicalUrl}}" />
  <link rel="alternate" hreflang="ja" href="{{japaneseUrl}}" />
  <link rel="alternate" hreflang="en" href="{{englishUrl}}" />
  <link rel="alternate" hreflang="x-default" href="{{japaneseUrl}}" />
  <link rel="icon" href="{{siteRoot}}favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="{{siteRoot}}tokens.css" />
  <link rel="stylesheet" href="{{siteRoot}}share.css" />
  <title>{{pageTitle}}</title>
</head>
<body>
  <main class="share-page">
    <article class="share-project" aria-labelledby="share-project-title">
      <div class="share-project-media">
        <img src="{{siteRoot}}{{image}}" alt="{{imageAlt}}" width="960" height="540" />
      </div>
      <div class="share-project-content">
        <p class="share-project-kind">{{kind}}</p>
        <h1 id="share-project-title">{{title}}</h1>
        <p class="share-project-description">{{description}}</p>
        <nav class="share-project-actions" aria-label="{{title}}">
          <a class="share-project-link share-project-link--portfolio" href="{{portfolioUrl}}" aria-label="{{permalinkLabel}}">{{permalinkAction}}</a>
          <a class="share-project-link share-project-link--primary" href="{{primaryUrl}}" target="_blank" rel="noopener noreferrer">
            <span>{{action}}</span>
            <span class="sr-only">{{opensInNewTab}}</span>
            <span aria-hidden="true">↗</span>
          </a>
        </nav>
      </div>
    </article>
  </main>
</body>
</html>
